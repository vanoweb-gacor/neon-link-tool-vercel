<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Link Tool v2</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#070b18;color:white;font-family:Arial,sans-serif}
.card{width:100%;max-width:430px;background:#10182d;border:1px solid #00e5ff;border-radius:20px;padding:25px;box-shadow:0 0 25px #00e5ff25}
h1{text-align:center;color:#00e5ff;font-size:27px}
p{text-align:center;color:#aebbd5;font-size:14px}
label{display:block;margin:20px 0 8px}
input,select,button{width:100%;padding:13px;margin-bottom:12px;border-radius:9px;border:1px solid #33476c;background:#080f20;color:white;font-size:15px}
button{background:#00e5ff;color:#07101a;font-weight:bold;border:none}
#result{overflow-wrap:anywhere;line-height:1.6}
a{color:#00e5ff}
</style>
</head>
<body>
<main class="card">
<h1>NEON LINK TOOL</h1>
<p>VERSION 2.0 • PEMERIKSA TAUTAN</p>
<label for="service">Pilih layanan</label>
<select id="service">
<option>Bicolink.com</option>
<option>SFL.gl</option>
</select>
<label for="url">Masukkan URL</label>
<input id="url" type="url" placeholder="https://contoh.com">
<button onclick="checkURL()">PERIKSA TAUTAN</button>
<div id="result"></div>
<p>Neon Link Tool v2</p>
</main>
<script>
function checkURL(){
const value=document.getElementById('url').value.trim();
const result=document.getElementById('result');
let url;
try{
url=new URL(value);
if(!['https:','http:'].includes(url.protocol))throw Error();
}catch(e){
result.textContent='Masukkan URL lengkap yang valid, diawali https://';
return;
}
result.replaceChildren();
const info=document.createElement('p');
info.textContent='Tautan valid. Layanan dipilih: '+document.getElementById('service').value;
const link=document.createElement('a');
link.href=url.href;
link.target='_blank';
link.rel='noopener noreferrer';
link.textContent='Buka tautan';
result.append(info,link);
}
</script>
</body>
</html>
